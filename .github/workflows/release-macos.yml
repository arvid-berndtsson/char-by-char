name: release-macos

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build icons
        run: npm run build:icons

      - name: Build macOS artifacts
        run: npm run package:mac

      - name: Generate Homebrew Cask
        run: npm run brew:cask

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            packaging/homebrew/Casks/char-by-char.rb

      - name: Checkout homebrew tap
        uses: actions/checkout@v4
        with:
          repository: arvid-berndtsson/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_PAT }}

      - name: Update cask in tap repo
        run: |
          mkdir -p homebrew-tap/Casks
          cp packaging/homebrew/Casks/char-by-char.rb homebrew-tap/Casks/char-by-char.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Casks/char-by-char.rb; then
            echo "No cask changes to publish."
            exit 0
          fi
          git add Casks/char-by-char.rb
          git commit -m "Update char-by-char cask for ${GITHUB_REF_NAME}"
          git push
