name: release-macos

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build icons
        run: npm run build:icons

      - name: Build macOS artifacts
        run: npm run package:mac

      - name: Generate Homebrew Cask
        run: npm run brew:cask

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/*.dmg
            dist/*.zip
            packaging/homebrew/Casks/char-by-char.rb

      - name: Validate tap token
        env:
          HOMEBREW_TAP_PAT: ${{ secrets.HOMEBREW_TAP_PAT }}
        run: |
          if [ -z "$HOMEBREW_TAP_PAT" ]; then
            echo "Missing secret HOMEBREW_TAP_PAT."
            echo "Add a PAT with write access to arvid-berndtsson/homebrew-tap in this repository's secrets."
            exit 1
          fi

      - name: Checkout homebrew tap
        uses: actions/checkout@v4
        with:
          repository: arvid-berndtsson/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_PAT }}

      - name: Update cask in tap repo
        run: |
          mkdir -p homebrew-tap/Casks
          cp packaging/homebrew/Casks/char-by-char.rb homebrew-tap/Casks/char-by-char.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Casks/char-by-char.rb; then
            echo "No cask changes to publish."
            exit 0
          fi
          git add Casks/char-by-char.rb
          git commit -m "Update char-by-char cask for ${RELEASE_TAG}"
          git push

  verify-homebrew-install:
    runs-on: macos-latest
    needs: build-and-release
    steps:
      - name: Tap repository
        run: |
          brew untap arvid-berndtsson/tap || true
          brew tap arvid-berndtsson/tap

      - name: Install cask from tap
        run: |
          brew install --cask arvid-berndtsson/tap/char-by-char

      - name: Verify installed app exists
        run: |
          test -d /Applications/char-by-char.app
          ls -la /Applications/char-by-char.app
