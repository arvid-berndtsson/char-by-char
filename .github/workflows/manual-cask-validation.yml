name: manual-cask-validation

on:
  workflow_dispatch:
    inputs:
      cask_ref:
        description: "Cask reference to validate"
        required: false
        default: "arvid-berndtsson/tap/char-by-char"

jobs:
  validate-cask-on-macos:
    runs-on: macos-latest
    steps:
      - name: Show environment
        run: |
          sw_vers
          brew --version

      - name: Tap repository
        run: |
          brew untap arvid-berndtsson/tap || true
          brew tap arvid-berndtsson/tap

      - name: Reinstall cask from tap
        run: |
          brew uninstall --cask "${{ inputs.cask_ref }}" || true
          brew install --cask "${{ inputs.cask_ref }}"

      - name: Verify app bundle exists
        run: |
          test -d /Applications/char-by-char.app
          ls -la /Applications/char-by-char.app

      - name: Verify Gatekeeper assessment
        run: |
          spctl --assess --type execute --verbose=4 /Applications/char-by-char.app

      - name: Verify code signature
        run: |
          codesign --verify --deep --strict --verbose=2 /Applications/char-by-char.app

      - name: Print quarantine attributes
        run: |
          xattr -lr /Applications/char-by-char.app || true
